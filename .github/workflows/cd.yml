name: cd.yml
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Публикация образа
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Проверка тега и версии
        run: |
          TAG=${GITHUB_REF_NAME#v}
          PKG=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "тег: $TAG, pyproject: $PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::тег $TAG не совпадает с версией $PKG в pyproject.toml"; exit 1; }


      - name: ghcr.io login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: метки
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
      - uses: docker/setup-buildx-action@v4

      - name: сборка и пуш
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: проверка
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}:${GITHUB_REF_NAME#v}"
          cat > .env <<EOF
          POSTGRES_USER=mlops
          POSTGRES_DB=mlops
          POSTGRES_PASSWORD=cd-test
          EOF
          cat > compose.release.yaml <<EOF
          services:
            app:
              image: $IMAGE
            mlflow:
              image: $IMAGE
            train:
              image: $IMAGE
          EOF
          docker compose -f docker-compose.yml -f compose.release.yaml pull db mlflow app
          docker compose -f docker-compose.yml -f compose.release.yaml up -d --no-build --wait db mlflow
          docker compose -f docker-compose.yml -f compose.release.yaml --profile training run --rm --no-deps train
          docker compose -f docker-compose.yml -f compose.release.yaml up -d --no-build --wait app
          curl --fail-with-body --silent --show-error http://127.0.0.1:8000/api/v1/version
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"samples":[{"sepal_length":5.1,"sepal_width":3.5,"petal_length":1.4,"petal_width":0.2}]}' \
            http://127.0.0.1:8000/process

      - name: Логи при ошибке
        if: failure()
        run: docker compose -f docker-compose.yml -f compose.release.yaml logs --tail=100

      - name: Остановка
        if: always()
        run: docker compose -f docker-compose.yml -f compose.release.yaml down -v
