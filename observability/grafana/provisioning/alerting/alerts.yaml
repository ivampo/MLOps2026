{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "pipeline",
      "folder": "MLOps",
      "interval": "5s",
      "rules": [
        {
          "uid": "queue-full",
          "title": "Queue over 90%",
          "condition": "C",
          "for": "1m",
          "noDataState": "NoData",
          "execErrState": "Error",
          "annotations": {
            "summary": "Queue over 90%",
            "description": "Sustained backpressure for one minute, not a short burst."
          },
          "labels": {
            "severity": "warning"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 60,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "sum(rabbitmq_detailed_queue_messages_ready{queue!~\".*[.]dlq\"}) / scalar(max(pipeline_queue_limit))",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "params": [
                        0.9
                      ],
                      "type": "gt"
                    },
                    "operator": {
                      "type": "and"
                    },
                    "reducer": {
                      "type": "last"
                    },
                    "type": "query"
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "dlq-nonempty",
          "title": "Messages in DLQ",
          "condition": "C",
          "for": "15s",
          "noDataState": "NoData",
          "execErrState": "Error",
          "annotations": {
            "summary": "Messages in DLQ",
            "description": "Any poison task needs investigation. 15s avoids a transient scrape."
          },
          "labels": {
            "severity": "warning"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 60,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "sum(rabbitmq_detailed_queue_messages_ready{queue=~\".*[.]dlq\"})",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "params": [
                        0
                      ],
                      "type": "gt"
                    },
                    "operator": {
                      "type": "and"
                    },
                    "reducer": {
                      "type": "last"
                    },
                    "type": "query"
                  }
                ]
              }
            }
          ]
        }
      ]
    }
  ]
}
