services:
  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.3.2}
    profiles: [logs, observability]
    command: [-config.file=/etc/loki/config.yaml]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - lokidata:/loki
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:3100/ready]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 256m

  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.5.1}
    profiles: [logs, observability]
    command: [run, /etc/alloy/config.alloy, --storage.path=/var/lib/alloy/data]
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-mlops2026}
    volumes:
      - ./log-agent/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloydata:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy
    mem_limit: 128m

  tempo:
    build:
      context: ./probe
      args:
        BASE_IMAGE: ${TEMPO_IMAGE:-grafana/tempo:2.6.1}
    image: mlops2026-tempo:local
    profiles: [traces, observability]
    command: [-config.file=/etc/tempo/config.yaml]
    volumes:
      - ./tempo.yaml:/etc/tempo/config.yaml:ro
      - tempodata:/var/tempo
    healthcheck:
      test: [CMD, /busybox, wget, -q, -O, /dev/null, http://localhost:3200/ready]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 256m

  otel-collector:
    build:
      context: ./probe
      args:
        BASE_IMAGE: ${COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.117.0}
    image: mlops2026-collector:local
    profiles: [traces, metrics, observability]
    command: [--config=/etc/otelcol/config.yaml]
    volumes: [./otel-collector.yaml:/etc/otelcol/config.yaml:ro]
    ports: ["127.0.0.1:4318:4318"]
    healthcheck:
      test: [CMD, /busybox, wget, -q, -O, /dev/null, http://localhost:13133/]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 192m

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.1.0}
    profiles: [metrics, observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --storage.tsdb.retention.size=256MB
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheusdata:/prometheus
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:9090/-/ready]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 192m

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.4.0}
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:3000/api/health]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 256m

volumes:
  lokidata:
  alloydata:
  tempodata:
  prometheusdata:
  grafanadata:
