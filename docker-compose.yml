x-python: &python
  init: true
  build: .
  image: mlops2026:local
  env_file:
    - .env
  environment: &python-environment
    POSTGRES_HOST: db
    MLFLOW_TRACKING_URI: http://mlflow:5000
    RABBITMQ_HOST: rabbitmq
    OMP_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
  networks:
    - backend
  logging:
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    init: true
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${MLOPS_CPU_LIMIT:-1}"
          memory: 1G
    logging:
      options:
        max-size: 10m
        max-file: "3"

  mlflow:
    <<: *python
    command: ["mlops-tracking"]
    environment:
      <<: *python-environment
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - mlartifacts:/mlartifacts
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5001}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${MLOPS_CPU_LIMIT:-1}"
          memory: 1G

  train:
    <<: *python
    command: ["mlops-train"]
    profiles: ["training"]
    depends_on:
      mlflow:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${MLOPS_CPU_LIMIT:-1}"
          memory: 1G

  app:
    <<: *python
    depends_on:
      mlflow:
        condition: service_healthy
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${MLOPS_CPU_LIMIT:-1}"
          memory: 1G

  worker:
    <<: *python
    command: ["uvicorn", "mlops.worker:worker_factory", "--factory", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
    stop_grace_period: 70s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${MLOPS_CPU_LIMIT:-1}"
          memory: 1G

  source:
    <<: *python
    command: ["mlops-source", "--count", "100"]
    profiles: ["tools"]
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    init: true
    image: rabbitmq:4-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2 +sbwt none +sbwtdcpu none +sbwtdio none"
      RABBITMQ_CTL_ERL_ARGS: "+S 1:1 +sbwt none +sbwtdcpu none +sbwtdio none"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${RABBITMQ_CPU_LIMIT:-2}"
          memory: 1G

volumes:
  pgdata:
  mlartifacts:
  rabbitmq_data:

networks:
  backend:
