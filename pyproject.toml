[project]
name = "mlops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ivan Startsev", email = "aladush3k@mail.ru" }
]
requires-python = ">=3.12.2"
dependencies = []

[project.scripts]
mlops = "mlops.__main__:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
web = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv]
default-groups = ["web", "dev"]


[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "RUF",
    "I",
    "E", "W",
    "N",
    "UP",
    "C4",
    "DTZ",
    "LOG", "G",
    "PT",
    "F",
    "S",
    "B",
    "SIM",
    "ASYNC",
    "T20",
    "PIE",
    "TD",
    "FAST"
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
docstring-code-format = true


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/mlops"]
branch = true
omit = ["src/mlops/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85
